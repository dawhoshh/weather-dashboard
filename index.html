<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погодний дашборд</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Погодний дашборд</h1>
    <nav>
        <a href="#current">Поточна погода</a>
        <a href="#forecast">Прогноз</a>
    </nav>
</header>

<main>
    <!-- Секція поточної погоди (одиничний блок, без article) -->
    <section id="current">
        <h2>Поточна погода</h2>
        <!-- Приклад форми пошуку міста з правильним label для доступності -->
        <label for="city-search">Пошук міста:</label>
        <input type="text" id="city-search" name="city">

        <p>+21&deg;C, сонячно</p>
        <!-- Обов'язковий атрибут alt для доступності -->
        <img src="assets/img/sun.svg" alt="Іконка: сонячно, без опадів">
    </section>

    <!-- Секція прогнозу на кілька днів -->
    <section id="forecast">
        <h2>Прогноз на тиждень</h2>

        <article>
            <h3>Вівторок</h3>
            <p>+18&deg;C, хмарно</p>
            <img src="assets/img/cloud.svg" alt="Іконка: хмарно">
        </article>

        <article>
            <h3>Середа</h3>
            <p>+16&deg;C, дощ</p>
            <img src="assets/img/rain.svg" alt="Іконка: дощ">
        </article>
    </section>
</main>

<aside>
    <h2>Порада дня</h2>
    <p>Сьогодні сонячно, не забудь сонцезахисні окуляри!</p>
</aside>


<footer>
    <p>Джерело даних: OpenWeatherMap. Навчальний проєкт, 2026.</p>
</footer>

<script src="js/app.js"></script>
</body>
</html>
